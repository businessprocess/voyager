name: Tests

on:
  push:
    branches:
      - '1.*'
  pull_request:
    types:
      - synchronize
      - opened
      - edited
      - reopened

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        db: [sqlite]
        exclude:
          - php: '8.2'
            laravel: 13.*
        include:
          - php: '8.5'
            laravel: 13.*
            db: mysql
          - php: '8.5'
            laravel: 13.*
            db: pgsql

    name: 'PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.db }}'

    services:
      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: voyager
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: ${{ matrix.db == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voyager
        ports:
          - 5432:5432
        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_PORT: ${{ matrix.db == 'pgsql' && '5432' || '3306' }}
      DB_USERNAME: ${{ matrix.db == 'pgsql' && 'postgres' || 'root' }}
      DB_PASSWORD: ${{ matrix.db == 'pgsql' && 'postgres' || '' }}

    steps:
      - uses: actions/checkout@v4

      # Configure PHP
      - name: Select PHP version
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mbstring, pdo_sqlite, pdo_mysql, pdo_pgsql, fileinfo, gd, exif
          coverage: none

      # Configure NPM
      - uses: actions/setup-node@v4
        with:
          node-version: '16.x'

      # Install PHP dependencies
      - name: Install Composer dependencies
        run: composer require "illuminate/support:${{ matrix.laravel }}"

      # Display installed laravel version
      - name: Show laravel version
        run: composer show laravel/framework

      # Generate vendor symlink
      - name: Generate vendor symlink
        run: ./vendor/bin/testbench

      # Install NPM dependencies
      - name: Install Dependencies
        run: npm install

      # Build static assets
      - name: Compile Assets
        run: npm run prod

      # Run phpunit tests
      - name: Run tests
        run: ./vendor/bin/phpunit --no-coverage
